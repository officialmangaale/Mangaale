server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- Crawler-facing files ---
  #
  # nginx picks an exact (`=`) location before any prefix or regex one, so
  # everything in this block is resolved before the SPA fallback at the bottom
  # can turn it into the app shell. That is the whole point: these paths have to
  # return their own bytes to a client that does not run JavaScript.

  # Served as text/plain. `types { }` empties the MIME map for this location so
  # `default_type` is what actually applies.
  location = /robots.txt {
    types { }
    default_type text/plain;
    charset utf-8;
    try_files $uri =404;
  }

  # application/xml, not the text/xml nginx maps .xml to by default: a sitemap
  # served as anything else is reported as a parse error rather than ignored.
  location = /sitemap.xml {
    types { }
    default_type application/xml;
    try_files $uri =404;
  }

  # Pre-rendered legal documents (scripts/staticPages.js). Extensionless URLs,
  # backed by real .html files.
  location = /privacy-policy {
    try_files /privacy-policy.html =404;
  }

  location = /account-deletion {
    try_files /account-deletion.html =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # APK Downloads Configuration
  location /downloads/ {
    alias /usr/share/nginx/html/downloads/;

    # Set correct MIME type for APK files
    types {
      application/vnd.android.package-archive apk;
    }

    # Force download with attachment
    add_header Content-Disposition "attachment; filename=$request_filename";

    # Security headers
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";

    # Cache control - APK files can be cached but validate periodically
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, must-revalidate";

    # Enable gzip compression for APKs
    gzip on;
    gzip_types application/vnd.android.package-archive;
    gzip_min_length 1000;

    try_files $uri =404;
  }

  # --- Single-page app ---
  #
  # Only the routes react-router actually renders get the shell. This used to be
  # a blanket `try_files $uri $uri/ /index.html`, which answered every URL on the
  # domain -- including typos and probes -- with HTTP 200 and the home page,
  # telling crawlers that every mistyped path is a real page.
  #
  # Keep in sync with src/data/siteRoutes.js and the rewrites in vercel.json.
  location ~ ^/(about|for-restaurants|for-customers|for-riders|pricing|contact|download|terms)/?$ {
    try_files /index.html =404;
  }

  location = / {
    try_files /index.html =404;
  }

  # Anything else: a real file if there is one, otherwise a real 404.
  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
